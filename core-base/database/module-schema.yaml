# module-schema.yaml — the FRAMEWORK tables, declared by the module that owns them.
# owner: template, full-copies.
#
# These four entities live in `core-base/database/infra/`, but Room needs ONE compile-time
# `entities = [...]` array literal on the @Database class, and core-base has no @Database — it is
# entity-only. So the classes cannot be composed in from here; only their NAMES can be projected.
#
# `core/database/build.gradle.kts` reads this file and passes it to `tools/database-ksp` as a ksp
# arg, which emits the rows into the generated `@Database`. Before that they were hardcoded in that
# array, which meant adding a framework table required hand-editing `core/database/AppDatabase.kt` —
# a file core-base does not own. Now it is: declare the table here, ship a migration unit, done.
#
# Why these are NOT `@DbEntity`-annotated like a fork's own tables: they live in THIS module, and the
# KSP pass that builds the @Database runs over `core/database`'s sources, which cannot see them.
# Their names are projected instead.
#
# NOT fork-editable. A fork's own tables go in `app-profile/app.yaml#database.entities`; these are
# the framework's, present in every fork, and a fork that drops one breaks core-base at runtime.
entities:
  - kpt.core.base.database.infra.entity.BookkeeperEntity
  - kpt.core.base.database.infra.entity.FetchedAtEntity
  - kpt.core.base.database.infra.entity.DraftEntity
  - kpt.core.base.database.infra.entity.ConflictEntity

daos:
  - { name: bookkeeperDao, type: kpt.core.base.database.infra.dao.BookkeeperDao }
  - { name: fetchedAtDao,  type: kpt.core.base.database.infra.dao.FetchedAtDao }
  - { name: draftDao,      type: kpt.core.base.database.infra.dao.DraftDao }
  - { name: conflictDao,   type: kpt.core.base.database.infra.dao.ConflictDao }
