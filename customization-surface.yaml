    owner: template
  - glob: "config/**"
    owner: template
  - glob: "secrets/sample/**"
    owner: template
  - glob: "secrets/**"                        # LAYOUT.yaml + scaffold (live/ is fork above)
    owner: template
  - glob: "docs/**"
    owner: template
  - glob: ".github/**"
    owner: template
