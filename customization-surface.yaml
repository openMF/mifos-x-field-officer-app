    owner: demo-showcase
  - glob: "core/network/**/kpt/core/network/jsonplaceholder/**"
    owner: demo-showcase
  - glob: "core/network/**/kpt/core/network/worldbank/**"
    owner: demo-showcase
  - glob: "core/network/**/kpt/core/network/lwmswhoxvvoagzkqxiyd/**"
    owner: template
  - glob: "core/network/**/kpt/core/network/config/**"
    owner: template
  - glob: "core/network/**/kpt/core/network/di/**"
    owner: template
  - glob: "core/network/**"
