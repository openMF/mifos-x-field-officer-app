    owner: demo-showcase
  - glob: "core/data/**/kpt/core/data/calc/**"
    owner: demo-showcase
  - glob: "core/data/**/kpt/core/data/cloudtodo/**"
    owner: demo-showcase
  - glob: "core/data/**/kpt/core/data/crypto/**"
    owner: demo-showcase
  - glob: "core/data/**/kpt/core/data/currency/**"
    owner: demo-showcase
  - glob: "core/data/**/kpt/core/data/economic/**"
    owner: demo-showcase
  - glob: "core/data/**/kpt/core/data/emi/**"
    owner: demo-showcase
  - glob: "core/data/**/kpt/core/data/profile/**"
    owner: demo-showcase
  - glob: "core/data/**/kpt/core/data/watchlist/**"
