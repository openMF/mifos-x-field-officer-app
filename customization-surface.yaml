  - glob: "core/designsystem/**/kpt/core/designsystem/chart/**"
    owner: template
  - glob: "core/designsystem/**/kpt/core/designsystem/component/**"
    owner: template
  - glob: "core/designsystem/**/kpt/core/designsystem/utils/**"
    owner: template
  # The fork-extension seam — template-owned so a sync keeps delivering upstream fixes.
  # MUST stay above the module catch-all below, which resolves `fork`.
  - glob: "core/designsystem/**/kpt/core/designsystem/config/**"
    owner: template
  - glob: "core/designsystem/**"
    owner: fork
  # core/ui — Compose primitives every feature composes. Template-authored; a fork's own primitives
  # fall to the catch-all.
  - glob: "core/ui/**/kpt/core/ui/bottombar/**"
    owner: template
  - glob: "core/ui/**/kpt/core/ui/input/**"
    owner: template
  - glob: "core/ui/**/kpt/core/ui/navigation/**"
