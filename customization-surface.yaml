    owner: template
  - glob: "core/datastore/**/kpt/core/datastore/prefs/**"
    owner: template
  # The fork-extension seam — template-owned so a sync keeps delivering upstream fixes.
  # MUST stay above the module catch-all below, which resolves `fork`.
  - glob: "core/datastore/**/kpt/core/datastore/config/**"
    owner: template
  - glob: "core/datastore/**"
    owner: fork
  # core/firebase — `config/` is the whole template-owned surface, matching what `config/` means in
