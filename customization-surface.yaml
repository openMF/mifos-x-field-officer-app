  #
  # The direction is safe BECAUSE the template's list is declared: a new template package must be
  # added to app-profile for the strip to reach it anyway, and G-MODEL-PKG (MP-1) fails if that row
  # has no matching ownership rule here — so a template package cannot silently land in this bucket.
