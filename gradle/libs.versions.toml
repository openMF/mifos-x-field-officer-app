# cmp-deep-link — commonMain deep-link handler. Android capture is auto-init (ContentProvider +
# ActivityLifecycleCallbacks, zero Activity wiring); RootNavScreen collects DeepLinkHandler.lastReceived and
# routes via the fork-owned DeepLinkRegistry seam. A fork with home-screen widgets / OS deep links fills the seam.
cmp-deep-link = { module = "io.github.mobilebytelabs:cmp-deep-link", version.ref = "kmptoolkit" }
# cmp-firebase — unified Firebase (Analytics + Crashlytics) engine + Compose companion.
cmp-firebase = { module = "io.github.mobilebytelabs:cmp-firebase", version.ref = "kmptoolkit" }
cmp-firebase-compose = { module = "io.github.mobilebytelabs:cmp-firebase-compose", version.ref = "kmptoolkit" }
# Platform capabilities wired into core-base/platform (+ cmp-toast into core-base/designsystem).
# All 21-target headless libraries except cmp-toast, which is Compose-only at 7.
#
# Bound in platformModule as the TOOLKIT types, not behind template-owned wrappers: a wrapper would
# either mirror each library or hide most of it, and neither insulation nor testability justified
# the cost — every one of these ships a public Fake* in its main artifact. cmp-app-review is the
# exception, kept behind kpt.core.base.platform.review.AppReviewManager because that interface
# already existed and reshapes rather than forwards.
#
# cmp-app-review replaces the hand-rolled AppReviewManagerImpl pair whose nonAndroidMain twin was an
# empty `promptForReview() {}` + TODO — every non-Android fork shipped a review prompt that silently
# did nothing. cmp-toast replaces KptSnackbarHost so ViewModels depend on an injectable
# ToastDispatcher instead of a Compose SnackbarHostState.
cmp-app-review = { module = "io.github.mobilebytelabs:cmp-app-review", version.ref = "kmptoolkit" }
cmp-clipboard = { module = "io.github.mobilebytelabs:cmp-clipboard", version.ref = "kmptoolkit" }
cmp-app-intents = { module = "io.github.mobilebytelabs:cmp-app-intents", version.ref = "kmptoolkit" }
cmp-bubble = { module = "io.github.mobilebytelabs:cmp-bubble", version.ref = "kmptoolkit" }
cmp-pdf-generator = { module = "io.github.mobilebytelabs:cmp-pdf-generator", version.ref = "kmptoolkit" }
cmp-toast = { module = "io.github.mobilebytelabs:cmp-toast", version.ref = "kmptoolkit" }
# Compose surfaces for cores already integrated above. Added to core-base/ui as `api`, which the
# feature convention plugin already gives every feature. Taken for their COMPOSABLES — ShareButton /
# ShareSheet / AppIntentsRegistry / rememberSupportsIntent — which call the libraries' global entry
# points directly and do not depend on the CompositionLocals these modules also export.
#
# Their exported locals (LocalShareManager, LocalIntentManager, LocalAppIntentsManager) carry the
# SAME simple names as the template's own in kpt.core.base.platform, and none of them throws when
# unprovided — each falls back to constructing its own impl. All three are therefore PROVIDED by
# LocalManagerProvider from the same DI instances, so either import resolves to the app's manager
# rather than a private second one. See the note in LocalManagerProviders.kt.
cmp-share-compose = { module = "io.github.mobilebytelabs:cmp-share-compose", version.ref = "kmptoolkit" }
cmp-intent-launcher-compose = { module = "io.github.mobilebytelabs:cmp-intent-launcher-compose", version.ref = "kmptoolkit" }
cmp-app-intents-compose = { module = "io.github.mobilebytelabs:cmp-app-intents-compose", version.ref = "kmptoolkit" }

