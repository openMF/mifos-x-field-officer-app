composeNavigation = "2.9.2"
jbCoreBundle = "1.0.1"
jbSavedState = "1.4.0"
material3adaptive = "1.2.0"
aboutLibraries = "15.0.3"

# Desktop Version
desktopPackageVersion = "1.0.0"

# Store 5
store = "5.1.0-alpha10"

#Room 3
room = "3.1.0-alpha01"
sqliteBundled = "2.7.0"
sqliteWeb = "2.7.0"

# worker-kmp — single-API background + foreground worker scheduling across
# Android / iOS / Desktop / Web. See https://github.com/MobileByteLabs/worker-kmp.
# Pin tracks last published release on Maven Central.
# 4.0.6: fixes the config-cache serialization discard (KSP/Gradle) seen on 4.0.4.
# 4.0.7: aligns worker-kmp's own toolchain with this template's — Kotlin 2.4.20, AGP 9.4.0,
#   Gradle 9.7.1, Compose MP 1.12.0 — and moves it to compileSdk 37, which upstream flags as
#   BREAKING. This template is already on compileSdk 37 (see `compileSdk` above), so that break
#   is pre-satisfied here. See https://github.com/MobileByteLabs/worker-kmp/releases/tag/v4.0.7.
#   NOTE: that release body lists `cmp-`-prefixed module names (`cmp-worker-kmp`, ...). Those are
#   NOT published — `cmp-worker-kmp` has no pom and no maven-metadata on Central. The real, and
#   only, coordinates remain the un-prefixed ones used below.
worker-version = "4.0.7"
# KMPNotifier — Kotlin Multiplatform local + push notifications (Android/iOS/Desktop/Web).
kmpnotifier = "2.0.0"

