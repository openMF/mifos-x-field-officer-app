cmp-open-url = { module = "io.github.mobilebytelabs:cmp-open-url", version.ref = "kmptoolkit" }
# cmp-inapp-update — 11-target update check + store launch. Replaces the Play-Core-only
# AppUpdateManagerImpl whose nonAndroidMain twin was two empty method bodies.
# Alias is `cmp-inapp-update`, NOT `cmp-in-app-update`: the generated accessor would be
# `libs.cmp.in.app.update` and `in` is a Kotlin keyword — the build script fails to compile.
# The published coordinate is unchanged.
