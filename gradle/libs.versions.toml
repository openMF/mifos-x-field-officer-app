# KMP Toolkit Libraries
# 3.5.28: adds cmp-app-review, cmp-clipboard, cmp-app-intents, cmp-bubble, cmp-pdf-generator and
#         cmp-toast to this template. Also drops nine transitive artifacts (firebase-perf,
#         firebase-config, firebase-abt, protobuf-javalite, dagger and friends): cmp-observe no
#         longer bundles the Firebase hooks — they moved to cmp-observe-firebase, which this
#         template does not depend on and never registered. Add that artifact explicitly if a fork
#         wants FirebaseCrashlyticsAttributionHook / FirebaseAnalyticsHealthHook / Performance.
# 3.5.21: cmp-firebase on GitLive 3.0.0-alpha02 (Firebase BoM 34.18.0) — wasmJs PROMOTED from the
#         Measurement-Protocol tier to the native Firebase tier, so wasmJs now reads FirebaseConfig.web
#         (the same `web` entry as js) and needs applicationId/apiKey/projectId/authDomain populated.
#         Also: cmp-share direct-to-app share (ShareOptions.targetPackage) + file:// → FileProvider
#         content:// resolution; cmp-remote-config min/max app-version gate.
kmptoolkit = "3.5.28"

# CMP Libraries
compose-plugin = "1.12.0"
coil = "3.5.0"
backHandlerVersion = "2.5.0"
constraintLayout = "0.8.0"
multiplatformSettings = "1.3.0"
mokoPermission = "0.20.1"
qroseVersion = "1.1.2"
okioVersion = "3.17.0"
kermit = "2.1.0"
# SKIE — Swift-friendly export of the KMP ComposeApp framework (E6 SwiftPM/XCFramework
# migration). Pin the SKIE release whose supported-Kotlin range covers this repo's
# `kotlin` version above; bump in lock-step with a Kotlin upgrade (SKIE gates the
# compiler version and fails fast on a mismatch). See 07-ios-swiftpm.md.
