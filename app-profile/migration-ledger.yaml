# migration-ledger.yaml — the FORK's Room schema state. owner: fork, never synced.
#
# WHY THIS FILE EXISTS
# Room's schema version is ONE monotonic integer and migrations are edges between consecutive
# values, so two independent authors incrementing it will collide. The previous scheme
# (`VERSION = TEMPLATE_BASE_VERSION + VERSION_OFFSET`) did not separate them — it relabelled a
# shared counter. Concretely: a fork at base 13 + offset 1 ships v14; the template then adds its own
# migration and bumps base to 14; the fork computes 15 while installed devices sit at 14, and Room
# finds no 14 -> 15 edge. It only ever worked while exactly one side migrated.
#
# THE SPLIT
#   app.yaml#migration_units[]   TEMPLATE-owned. WHAT the template can add, with a stable id and NO
#                                version numbers. Full-copies on sync.
#   this file                    FORK-owned. WHERE each unit landed in THIS fork's sequence.
#
# The two sides write to different files, so a template schema change is an append here, never a
# merge conflict — the same separation that makes `feature-deps.gradle.kts` work.
#
# APPEND-ONLY. `./gradlew syncForkConfig` adds a row for any unit not already in `baseline_units` or
# `migrations`, at this fork's next free version. It MUST NOT renumber an existing row: a shipped
# `from`/`to` edge is a contract with every installed device, and renumbering strands them.

# Effective Room schema version. Owned outright by this fork — the template does not contribute to it.
#
# 13 -> 14 (2026-10-02): dropped six inverted FOREIGN KEY constraints (Client, Center, Group,
# SavingsAccountTransaction, LoanTimeline, LoanWithAssociations). Each named its own embedded detail
# table as the PARENT of its id, so SQLite refused every insert with `787 FOREIGN KEY constraint
# failed` and the offline cache could never be written. Columns are unchanged; only the constraints
# differ, which Room still treats as a schema change (its identity hash covers constraints).
#
# This row also closes a DRIFT that predates it: this file read `version: 1` while the generated
# `ForkDatabaseConfig.VERSION` read 13. `syncForkConfig` only rewrites `version:` when it APPENDS a
# template migration unit, so with no unit pending the two never reconciled, and the number here
# described nothing. 14 is the real next version for both.
version: 14

# Units already folded into this fork's INITIAL schema. A fresh fork is created with the framework
# tables in their current shape, so it needs no migration for them — it records them here instead.
# `remove-demo.sh` sets this to every declared unit id when it resets a clean fork to v1.
baseline_units: [framework-fetched-at,framework-submit-drafts drafts-unique-key,framework-write-conflicts drafts-attempt-count]

# The applied sequence. `unit:` ties a row to its declaration; `from`/`to` are this fork's numbering.
migrations:
