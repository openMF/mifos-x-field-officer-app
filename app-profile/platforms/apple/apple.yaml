# app-profile/platforms/apple/apple.yaml — Apple-shared (iOS + macOS: signing, Firebase, TestFlight, ASC).
# Only values that DIFFER from the common app.yaml live here.
apple:
  team_id: L432S2FZP5                        # apple.team.id — the openMF Apple Developer team (shared with mobile-wallet)
  # The App Store NUMERIC id (not the bundle id). Deploy lanes already needed it; the APP needs it too,
  # because `AppReviewManager.promptForCustomReview()` deep-links to the store listing and iOS has no
  # bundle-id-based store URL. It lived in `deployment-layer/DEPLOYMENT_PROJECT_CONFIG.yaml` and
  # hardcoded in `deployment/ios/testflight/lane.rb` — neither of which the running app can read.
  #
  # This is the PROJECT-scope SoT. `resolve-deploy-config.sh` keeps the three scopes in order for
  # deploy time (deployment-layer override → here → _org/company.yaml), and `syncForkConfig` projects
  # THIS value into the generated `core/platform/config/AppReviewConfig` for runtime.
  app_store_id: ""                           # apple.app.store.id — empty: this app is not on the App Store yet
  match:
    git:
      url: git@github.com:openMF/ios-provisioning-profile.git   # apple.match.git.url — PROVISIONING_REPOS.yaml (mifos-x)
      branch: dev                            # apple.match.git.branch
  firebase:
    # Empty: no iOS Firebase app is registered for com.mifos.mifosxdroid (the original app never
    # shipped a GoogleService-Info.plist). Register one in the mifos-mobile-apps project, then fill these.
    ios_app_id_prod: ""                       # firebase.ios.prod.app.id
    ios_app_id_demo: ""                       # firebase.ios.demo.app.id
    ios_app_id: ""                            # firebase.ios.app.id (legacy single-flavor key)
  testers:
    internal_group: Internal Testers         # apple.testers.internal.group
    external_group: mifos-mobile-apps        # apple.testers.external.group — the Firebase project's tester group
    external_public_link: "true"             # apple.testers.external.public.link
    # External TestFlight tester roster (emails — PUBLIC identifiers, not secrets). deployment/_shared/config.rb
    # #sync_testflight_testers reads this list and adds each as an external beta tester on the group.
    # For an org-shared roster, materialize this from your org SoT. Leave empty for public-link-only.
    external_emails: []                      # apple.testers.external.emails — e.g. [alice@example.com, bob@example.com]
  keywords: 'field officer,microfinance,Fineract,Mifos,loans,savings,collection sheet,financial inclusion'  # store.ios.keywords
  category: 'FINANCE'                          # store.ios.category
  # App Store trade-representative contact (App Review → App Information). iOS + macOS App Store.
  # Only the values Mifos has actually published are filled; the rest stay empty until authored.
  # syncForkConfig DERIVES deployment/{ios/appstore,desktop/mac-app-store}/metadata/
  # trade_representative_contact_information/*.txt from these keys — never hand-edit those .txt files.
  trade_representative:
    first_name: ''                           # unauthored — store.apple.trade.first.name
    last_name: ''                            # unauthored — store.apple.trade.last.name
    address_line1: ''                        # unauthored — store.apple.trade.address.line1
    address_line2: ''                        # store.apple.trade.address.line2
    address_line3: ''                        # store.apple.trade.address.line3
    city_name: ''                            # unauthored — store.apple.trade.city
    state: ''                                # unauthored — store.apple.trade.state
    country: 'US'                              # store.apple.trade.country — Mifos Initiative is US-based
    postal_code: ''                          # unauthored — store.apple.trade.postal.code
    phone_number: ''                         # unauthored — store.apple.trade.phone
    email_address: 'team@mifos.org'            # store.apple.trade.email — Mifos Initiative's published contact
    is_displayed_on_app_store: 'false'       # store.apple.trade.displayed
