  short_description: 'Loan tracker, EMI calculator, bill reminders & interest rates. Offline.'  # store.android.short.description
  changelog: 'YOUR_APP_CHANGELOG — describe what is new in this release.'  # PLACEHOLDER — store.android.changelog
  video_url: ""                              # store.android.video.url (Play Store promo YouTube URL)
  # play_tracks_by_flavor: "prod=internal,demo=internal"   # android.play.tracks.by_flavor (optional override)
  firebase:
    app_id_prod: 1:000000000000:android:placeholder   # PLACEHOLDER — firebase.android.prod.app.id
    app_id_demo: 1:000000000000:android:placeholder   # PLACEHOLDER — firebase.android.demo.app.id
    groups: your-firebase-app-group          # PLACEHOLDER — firebase.groups (Firebase App Distribution tester group[s], CSV)
  play_testers:
    internal_googlegroup: ""                 # play.testers.internal.googlegroup
    closed_googlegroup: ""                   # play.testers.closed.googlegroup
