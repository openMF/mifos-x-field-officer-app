# app-profile/app.yaml — fork-owned white-label deployment SoT (COMMON, platform-agnostic).
#
# This is the SINGLE source of truth for all fork-owned deployment data (text + media).
# Edit HERE — never gradle/fork.properties (now a generated/fallback build-bridge).
# deployment/ reads this via deployment/_shared/config.rb (AppProfile.get).
# `sync-dirs.sh` NEVER rewrites app-profile/** (owner: fork in customization-surface.yaml).
#
# Platform-DIFFERENT values live in app-profile/platforms/<platform>/*.yaml — no duplication.

identity:
  app_id: com.mifos.mifosxdroid              # SoT for appId (from dev: libs.versions.androidPackageNamespace)
  app_name: MifosXDroid                      # from dev: cmp-android/src/main/res/values/strings.xml#app_name
  namespace: com.mifos.mifosxdroid           # mirrors app_id
  # Apex domain the ARCHITECTURE DOCS publish under, as `docs.<this value>`. OPTIONAL and UNSET by
  # default: with no value the docs workflow still deploys, to the Cloudflare Pages `*.pages.dev`
  # URL it gets for free, and simply attaches no custom domain. It is declared here rather than
  # derived from `app_id` because a reversed package id is not a domain a fork necessarily owns —
  # guessing one would publish to a host nobody controls and hand out a link that never resolves.
  # The Pages PROJECT name is always `docs-<fork.project.name>`, so it is unique without this.
  docs_domain: ""                          # e.g. "mifos.org" → docs.mifos.org

# Per-flavor network endpoints + demo credentials + log tag. syncForkConfig emits these into
# gradle/fork.properties (network.base.url.{demo,prod} / demo.username / demo.password / log.tag),
# which KMPFlavorsConventionPlugin reads into per-flavor BuildConfig (BASE_URL / DEMO_USERNAME /
# DEMO_PASSWORD / LOG_TAG). Blank falls back to the template default baked into the plugin. (B4)
network:
  # Extra BuildKonfig fields for `core/network` that are NOT tied to an access point (analytics keys,
  # feature flags). An access point's `anon_key_env:`/`api_key_env:` already generates its own field —
  # declare those on the point, not here. Both feed the `syncForkConfig:buildkonfig` region of
  # `core/network/build.gradle.kts`, so a declared key ALWAYS has a matching BuildKonfig field
  # (NAP-8); the value is read at build time from the env var or local.properties, never committed.
  #
  #   build_config_fields:
  #     - name: MY_ANALYTICS_KEY      # the BuildKonfig constant
  #       from_env: MY_ANALYTICS_KEY  # env var / local.properties key (defaults to `name`)
  build_config_fields: []
  # demo_base_url REMOVED 2026-10-22 — it was `https://demo.mifos.org`, whose host
  # TCP-times-out (see the removed `staging` access point below). It fed only
  # `BuildConfig.BASE_URL` for the demo flavor via `forkProp("network.base.url.demo")`,
  # and NOTHING in this fork reads `BuildConfig.BASE_URL` at runtime — every call
  # goes through the `mifos` access point. Absent, `get()` returns "" and
  # KMPFlavorsConventionPlugin falls back to its baked-in template default, so
  # the demo flavor still builds. Re-add it pointing at a REACHABLE host if the
  # demo flavor ever needs a real endpoint.
  prod_base_url: https://apis.mifos.community  # the `mifos` access point's origin
  demo_username: demo
  demo_password: demo
  log_tag: MifosXDroid
  # Network privacy (GDPR: a log line is personal data once a body holds a name, account or token).
  # Every key is optional; ABSENT = the secure default shown. syncForkConfig projects this onto
  # AppAccessPoints.policy, which core-base applies to every access point's client.
  logging:
    release: none            # none | info | headers — `body` is refused: release builds never log bodies
    debug: body              # none | info | headers | body — debug builds never ship
    # Query parameters masked in logged URLs, on top of the built-in credential names
    # (api_key, token, access_token, password, secret, signature, code, …).
    redact_query_params: []
  # CORS relay that WEB builds route `proxied_host` calls through. A relay sees every request it
  # forwards, so it is a third-party processor: declare it here (and in the privacy policy) or omit it
  # for none. The template's FRED demo needs one on web; a fork should self-host or drop it.
  web_cors_proxy: none        # no access point declares `proxied_host`, so web builds need no relay
  # Declarative access-point topology — every REST + Supabase endpoint the app talks to, in ONE place.
  # This is the SoT for core/network's AccessPointRegistry AND for the generated DI wiring: declare an
  # endpoint here, run `./gradlew syncForkConfig`, and the only thing left to write is the API type.
  #
  # Per-entry fields:
  #   id             stable key referenced by restApi("<id>") / supabaseApi("<id>").
  #   type           rest | supabase  → AccessPointKind.
  #   base_url       ORIGIN only — scheme + host, ending at the first `/`
  #                  (`https://sandbox.mifos.community/`). For Supabase, the project URL.
  #   base_path      optional — the API path under that origin (`fineract-provider/api/v1/`). Split
  #                  from base_url because they change for different reasons: the ORIGIN is what a
  #                  fork repoints (sandbox -> production, per-flavour host) and what
  #                  DynamicBaseUrlPlugin rewrites at runtime, while the PATH belongs to the API and
  #                  travels with the endpoint. Joined as origin + "/" + path + "/".
  #   loggable_host  host enabled for HTTP logging.
  #   proxied_host   optional — route via the platform proxy (CORS-blocked hosts).
  #   main           optional, at most ONE point — `main: true`. Its clients follow the RUNTIME main
  #                  network config (core-base NetworkConfigRepository): the app can edit any config,
  #                  add one at runtime, disable it, or switch which is main, persisted across restarts.
  #                  The values declared here are the defaults that `reset` returns to.
  #   secret_alias   optional — vault alias for a REQUEST-time key (e.g. FRED's @Query api_key).
  #   (no `api:` field) — the class<->point link lives on the CLASS, as `@ApiBinding("<id>")`, which
  #                  generates the Koin binding into core/network/.../di/GeneratedApiBindings.kt:
  #                    rest      → `restApi("<id>") { it.create<Simple>() }`  (Ktorfit factory by convention)
  #                    supabase  → `supabaseApi("<id>") { <Simple>(it) }`     (single-arg ctor taking
  #                                SupabaseConfigClient)
  #                  An endpoint declared here with no annotated class is simply not wired yet.
  #   auth           optional — none | basic | bearer | oauth (default none). Declaring it makes the
  #                  `Authorization` header AUTOMATIC: the generator emits its spec and the auth
  #                  bridge fills the value from the stored credential in that scheme's wire format
  #                  (`Basic <t>` / `Bearer <t>`), so no call site formats a credential by hand.
  #                  An explicit `Authorization` row in `headers` overrides it, for a fork whose
  #                  scheme is non-standard.
  #   headers        optional — headers sent on EVERY request to this point. Two kinds:
  #                    - { name: X, value: literal }   static, baked into AppAccessPoints
  #                    - { name: X, runtime: some.key } value supplied at RUNTIME via
  #                      RuntimeHeaderStore["some.key"] — set it at login (Basic / OAuth), clear it on
  #                      sign-out. Declared here by NAME so "which header does this API need" is a
  #                      property of the endpoint, not something a ViewModel invents; only the VALUE
  #                      is runtime. An unset runtime header is OMITTED, never sent empty.
  #
  #                    Do NOT declare `Accept` or `Content-Type: application/json`: the shared client
  #                    sets them — Accept from ContentNegotiation, and core-base's JsonBodyContentType
  #                    names JSON for a typed (`@Body`) object, which ContentNegotiation needs before
  #                    it will serialize one. A text post keeps text/plain and a GET sends none. A
  #                    server that speaks ANOTHER type declares it here and it wins. Enforced by NAP-13.
  #   anon_key_env   supabase only — env / local.properties key holding the anon key. Generated into
  #                  AppSupabaseAnonKeys as a BuildKonfig read, so no key is ever committed. Omit and
  #                  the point resolves to an empty key (client stays inert, isConfigured == false).
  #
  # syncForkConfig regenerates AppAccessPoints.points, AppUrlTypes and AppSupabaseAnonKeys from this
  # list. GeneratedApiBindings comes from `@ApiBinding` instead — see above. (B3, epic
  # pure-white-label-store5-network)
  # Every access point declares `owner:` — the ONE field that decides its lifecycle:
  #
  #   owner: fork      the CONSUMER's endpoint. Kept by the customizer, never touched by a sync.
  #   owner: template  shipped to EVERY fork and KEPT by the customizer — `project` (Supabase) is the
  #                    one: a fork gets a working backend access point by default.
  #   owner: demo      the template's own showcase. `scripts/remove-demo.sh` DELETES the entry AND
  #                    its `kpt/core/network/<id>/` package, so "forking = starting clean" is a
  #                    declared property of each endpoint rather than a positional comment fence the
  #                    strip has to parse (such a fence could not express `project`, whose point
  #                    sat outside it while its `api:` sat inside).
  #
  # `main`/`staging` are `fork`: they are placeholders for the CONSUMER's own backend, and
  # `UrlType.MAIN` is the framework default in core-base/network — every fork needs one.
  access_points:
    - id: mifos
      owner: fork
      type: rest
      main: true                    # the Fineract server the officer signs in to — switchable at runtime
      # The Field Officer API gateway. ORIGIN only; the API path travels with the endpoint.
      #
      # `1.0/field/v1/` — NOT the plain Fineract `fineract-provider/api/v1/`. This app talks to the
      # field-officer gateway documented at
      # https://mifosforge.jira.com/wiki/spaces/MP/pages/4537024513 (base URL
      # `https://apis.mifos.community/1.0/field`). Measured 2026-10-01 by probing both paths with a
      # throwaway credential: `1.0/field/v1/authentication` answers 401 (exists, rejected) while
      # `fineract-provider/api/v1/authentication` answers 404. The old value made EVERY call 404, so
      # sign-in failed with "Login failed. Check your credentials" no matter what was typed.
      #
      # This point is ALSO the server-config screen's default ("Use defaults", and the stored
      # preference's fallback): `AppServerConfig` (core/network, fork-owned) derives it from this
      # point at runtime, so the screen and the HTTP client cannot name different servers. Change
      # the server HERE only.
      #
      # BACK ON THE GATEWAY 2026-10-24 — it is live again. Probed with no credentials: every
      # `1.0/field/v1/*` path answers 401 and echoes `/fineract-provider/api/v1/*` (the gateway
      # rewrites onto Fineract), and `POST 1.0/field/v1/authentication` answers Fineract's own
      # `error.msg.not.authenticated`. From 2026-10-22 to 2026-10-24 this pointed at the public
      # `sandbox.mifos.community` (plain Fineract, tenant `default`) while the gateway returned 502;
      # git history has that block if it is ever needed again.
      base_url: https://apis.mifos.community/
      base_path: 1.0/field/v1/
      auth: basic                   # Fineract authenticates the field officer with basic credentials
      loggable_host: apis.mifos.community
      headers:
        # Fineract requires a tenant on EVERY call; it is a build-time constant, unlike the
        # Authorization header which the login flow writes to the runtime store.
        #
        # KNOWN GAP (S7): this is still a BUILD constant, so editing Tenant — or any other field —
        # on the server-config screen does not reach the HTTP client; the access point's values win.
        # Tracked in feature/settings/MIGRATION.md; until then the shipped default is the only
        # server that works.
        - { name: Fineract-Platform-TenantId, value: mifos-bank-1 }
    # REMOVED 2026-10-22 — the `staging` access point (`https://demo.mifos.org/`,
    # `fineract-provider/api/v1/`, tenant `default`).
    #
    # It was dead twice over. The HOST is unreachable: DNS resolves
    # (75.149.167.24) but TCP times out — not a 5xx, no listener. And NOTHING
    # was bound to it: all 22 `@ApiBinding` declarations name `"mifos"`, so the
    # point generated an `AppUrlTypes.STAGING` constant and an `AccessPoint` row
    # that no API could ever reach. Repointing it at a live host would therefore
    # still have changed nothing — the binding is what selects a point, and no
    # binding named it.
    #
    # Probed with every other Mifos host referenced in this repo on 2026-10-22;
    # the only live Fineract found was `sandbox.mifos.community`
    # (`fineract-provider/api/v1/`, tenant `default`). It is deliberately NOT
    # added here: making a public sandbox that authenticates a Super user the
    # app's shipped endpoint is a product decision, not a config tidy.
    #
    # A fork that wants a second environment adds the point back AND gives it
    # bindings — `@ApiBinding("staging")` on the API types that should use it.

# ── Room database — declared by ANNOTATION, not here (E1/C7, superseded by the KSP migration) ──
# This block used to carry `entities:` / `daos:` / `type_converters:` / `auto_migrations:`, which
# syncForkConfig projected into `gen-*` regions of `core/database/**/AppDatabase.kt`. All of it is
# gone: the declaration is now the annotation ON the class, and AppDatabase is generated whole.
#
# Adding a fork table is: write the `@Entity` and annotate it `@DbEntity`; write the `@Dao` and
# annotate it `@DbDao`. Nothing else — no row here, no accessor, no Koin binding. The one thing
# still recorded by hand is schema HISTORY, in `app-profile/migration-ledger.yaml`, because a
# `from`/`to` edge is a contract with every installed device that no class can carry.


# ── Module package ownership ────────────────────────────────────────────────────────────────────
#
# Each module declares its own packages in `core/<module>/module-packages.yaml`, next to the code it
# describes, using the three-value vocabulary `demo | template | fork`. They are NOT inlined here.
#
# Why not here: this file is `owner: merge` — it carries template AND fork declarations, so a
# template edit landing beside a fork edit is a 3-way merge waiting to happen. A per-module file is
# TEMPLATE-ONLY and full-copies, the same split that took Room's `migration-units.yaml` out of this
# file. The module that gains a package is now the module whose file changes.
#
# `module_packages` below is the CONNECTION: the modules whose declarations make up this app. It is
# what tells a reader (and `/kmp-project-template-sync`) where to look, and it is asserted against
# what is on disk by G-CORE-PKG, so a module cannot be added here without its file — or the reverse.
    - id: lwmswhoxvvoagzkqxiyd
      owner: template
      type: supabase
      # The project REF is the public identity in https://<ref>.supabase.co — it is the access-point
      # id, the package name under core/network, and the @ApiBinding argument, all the same string.
      # Rename all three together: network-ksp matches the annotation against the declared ids, so a
      # package rename alone leaves @ApiBinding naming an id app-profile no longer declares.
      base_url: https://lwmswhoxvvoagzkqxiyd.supabase.co
      auth: none                    # Supabase authenticates with its publishable key + gotrue, not an Authorization header we set
      loggable_host: lwmswhoxvvoagzkqxiyd.supabase.co
      publishable_key_env: SUPABASE_PUBLISHABLE_KEY   # secrets/LAYOUT.yaml#supabase_publishable_key; empty sample → "" → client inert

# ── Module package ownership ────────────────────────────────────────────────────────────────────
#
# Each module declares its own packages in `core/<module>/module-packages.yaml`, next to the code it
# describes, using the three-value vocabulary `demo | template | fork`. They are NOT inlined here.
#
# Why not here: this file is `owner: merge` — it carries template AND fork declarations, so a
# template edit landing beside a fork edit is a 3-way merge waiting to happen. A per-module file is
# TEMPLATE-ONLY and full-copies, the same split that took Room's `migration-units.yaml` out of this
# file. The module that gains a package is now the module whose file changes.
#
# `module_packages` below is the CONNECTION: the modules whose declarations make up this app. It is
# what tells a reader (and `/kmp-project-template-sync`) where to look, and it is asserted against
# what is on disk by G-CORE-PKG, so a module cannot be added here without its file — or the reverse.
module_packages:
  - core/common/module-packages.yaml
  - core/data/module-packages.yaml
  - core/database/module-packages.yaml
  - core/datastore/module-packages.yaml
  - core/designsystem/module-packages.yaml
  - core/domain/module-packages.yaml
  - core/firebase/module-packages.yaml
  - core/model/module-packages.yaml
  - core/network/module-packages.yaml
  - core/platform/module-packages.yaml
  - core/store/module-packages.yaml
  - core/ui/module-packages.yaml
  - feature/module-packages.yaml

# The FORK's answer to those files is `app-profile/package-ledger.yaml` (owner: fork, never synced):
# what the customizer actually did to each declared package — `removed` | `kept` | `absent`. A sync
# reads it so it never has to guess whether a missing package was stripped on purpose or lost.

org:
  name: Mifos Initiative
  email: team@mifos.org
  first_name: Mifos
  last_name: Initiative
  phone: "+19078675309"
  copyright: "© 2026 Mifos Initiative. All rights reserved."   # desktop / Mac App Store packaging copyright (org.copyright)
  secrets_namespace: mifos-x   # vault-alias prefix for org-shared secrets (`mifos-x-<suffix>`); per-app ones use projectName
  marketing_url: https://mifos.org
  privacy_url: https://raw.githubusercontent.com/openMF/kmp-project-template/main/legal/output/privacy-policy.md
  support_url: https://github.com/openMF/mifos-x-field-officer-app   # this app's repo — About (source/license/contributors) + store support link
  # The fork's own named links, generated into kpt.core.model.config.AppOrgLinks by syncForkConfig
  # (`AppOrgLinks["community"]`). About reads `community` (Community row, the Mifos Slack — #mobile)
  # and `product` (Product site row, the app's guides).
  links:
    community: https://mifos.slack.com/
    product: https://mifos-products.pages.dev/mobile/field-officer/

# Legal entity behind the app — rendered into the generated privacy policy and terms.
# Required before a store submission; a store rejects a listing whose policy names no entity.
legal:
  company_name: Mifos Initiative
  jurisdiction: United States
  effective_date: June 6, 2026
  contact_email: team@mifos.org

# Distinguished name baked into a generated Android keystore.
# Used ONCE, at keystore creation. Changing it afterwards has no effect — the existing
# keystore keeps the DN it was born with, and replacing the keystore breaks app updates.
keystore_dn:
  org_unit: Mobile
  city: Arusha
  state: Arusha
  country: TZ

# Store-listing copy: title, descriptions, keywords, category.
# This fork's own listing. Edit it here, or promote a variant from
# deployment-layer/store-listing/variants/ — never ship the template's copy to a live store.
store:
  primary_locale: en-US
  # Store copy taken from the app's own published Play listing on `dev`
  # (fastlane/metadata/android/en-US/{title,short_description,full_description}.txt and
  # changelogs/6.txt) — authored by Mifos for this app, not the template's demo copy.
  title: 'MifosX Android Client'                    # app display name (App Store name / Play title)
  subtitle: 'Field operations on Apache Fineract'
  promotional_text: 'Mobile field operations app for financial inclusion built on Apache Fineract.'
  description: |-
    Financial Inclusion is at your fingertips directly in the field. This app gives financial institutions the full power of Mifos X wherever they are by allowing field-based staff to handle all their daily operations from onboarding new clients and accounts to collecting repayments and deposits, and surveying clients in the field. Supervisors can now ensure greater efficiency and transparency with field operations. Offline data synchronization for clients and groups is now available to support opening new clients and doing field collections while in remote regions without connectivity.

    The following field operations are supported:

    <b>Office Management</b>
    - Create center new groups and centers
    - Create clients from within parent group
    - Create new groups from with parent center.

    <b>Client Management</b>
    - Create new clients individually and within a group
    - View client details.
    - Add identifiers and documents to clients.
    - Take client photo via webcam.
    - Pinpoint client GPS location

    <b>Account Management</b>
    - Open, approve, and disburse new loan accounts
    - Open, approve, and activate new savings accounts
    - Attach documents to loan and savings accounts.
    - Support for data tables & adding documents
    - Input repayments for loans
    - Input deposits and withdrawals for savings accounts.
    - Attach charges to accounts.
    - View full details and transaction history for loan and savings accounts

    <b>Offline Data Collection & Synchronization</b>
    - Synchronize clients and groups for offline data entry
    - Enter repayments, deposits, and withdrawals while offline
    - Create new clients while offline
    - Create new loan and savings accounts while offline.

    <b>GIS & Location-Based Features</b>
    - Pinpoint GPS location of a client residence.
    - Track route of field officer.
  release_notes: |-
    - Create center new groups & centers
    - Create clients & groups from parent entity
    - Improved navigation & advanced search
    - Open, approve, disburse new loan & savings accounts
    - Attach documents to loan & savings accounts.
    - Offline Data Collection & Synchronization
    - Synchronize clients and groups for offline
    - Enter repayments, deposits, and withdrawals while offline
    - Create new clients, loans & savings accounts while offline
    - Pinpoint client GPS location
    - Track route of field officer
  copyright: 'Copyright © 2026 Mifos Initiative'
  age_rating: '4+'                            # iOS + macOS App Store age rating (store.ios.age.rating)
  review:
    notes: >-
      Sign in to a Fineract server. The server picker on the sign-in screen lists the community
      demo instances; pick one and use the demo account it shows.
    first_name: 'Mifos'                        # App Store review contact (mirrors org.first_name)
    last_name: 'Initiative'                    # App Store review contact (mirrors org.last_name)
    demo_user: ""                            # store.review.demo.user (per-instance; shown in the picker)
    demo_password: ""                        # store.review.demo.password
  app_description: 'MifosX Android Client'                # desktop packaging description (app.description)

# In-app review prompting — NOT the `store.review` block above.
#
# `store.review` is the App STORE review TEAM's contact + demo notes, read at submission time.
# This is the running app asking a user to rate it. The names sit one word apart and the meanings do
# not overlap at all, so they are deliberately separate top-level keys rather than nested siblings.
#
# `syncForkConfig` projects this into the generated `core/platform/config/AppReviewConfig`, which
# `AppViewModel` reads. Store identity is NOT duplicated here — it resolves from
# `platforms/apple/apple.yaml#apple.app_store_id` (iOS) and `identity.app_id` (Android).
in_app_review:
  enabled: true
  # These guard the CUSTOM path. The native prompt is rate-limited by the OS itself, but
  # `promptForCustomReview()` deep-links to the store and would otherwise fire whenever asked.
  min_launches: 5                            # never on first launch — before the app has earned it
  min_days_since_install: 3
  cooldown_days: 90                          # after a prompt, do not ask again inside this window

# The repository's community files. The Mifos devops and security teams set them up per repository —
# not the template and not this repo's tooling — so a template sync never writes them. Who may edit
# them is the org's call: workspaces/mifos-x/_org/company.yaml#repo_files (mifos-x: access: read).
repo_files:
  managed_by: org
  files:
    CODE_OF_CONDUCT.md: { access: read }
    CONTRIBUTING.md:    { access: read }
    LICENSE:            { access: read }
    SECURITY.md:        { access: read }
    .github/workflows/cla-check.yml: { access: read }   # the org CLA bot pushes it

# Generated into kpt.core.model.config.AppSecurityConfig by syncForkConfig.
security:
  # Whether a FRESH install allows screenshots + screen recording (false = FLAG_SECURE on Android, the
  # window also hidden from the recents thumbnail). It is only the starting value: the user's own
  # choice (Settings → "Allow screen capture") is persisted by core/datastore and wins from then on.
  # Debug builds always allow capture so QA / device-test tooling can screenshot.
  screen_capture_allowed_by_default: false
  # The field officer signs in to a Fineract server, so a fresh install starts signed OUT and lands on
  # sign-in. An absent key means `true` (the template has no login).
  signed_in_by_default: false
# Privacy consent (GDPR Art. 6(1)(a) / 7): analytics and crash reporting are CONSENT-based processing, so
# they must start OFF and be as easy to withdraw as to give (Settings → Privacy). These are only the
# starting values for a fresh install; the user's own choice is persisted by core/datastore and wins.
# ABSENT = false. Set `true` only where you rely on another lawful basis and have documented it (DPIA).
# Nothing is collected before the stored choice is read: core-base starts Firebase with collection off.
privacy:
  analytics_enabled_by_default: false
  crash_reporting_enabled_by_default: false

# Fork-owned media sources: screenshots, feature graphic, promo video.
# Paths are relative to app-profile/; a missing file is a skip, not an error, so a fork can add
# platform media incrementally.
media:
  root: media

# ── Deploy targets — fork-facing PLATFORM on/off intent ───────────────────────
# This block is the FORK-owned answer to "which PLATFORMS does my fork ship?".
# It is COARSE (one row per platform) and pairs with the template-owned, FINE-grained
# deployment/DEPLOYMENT_MANIFEST.yaml (one row per deploy TARGET, e.g. android-firebase,
# ios-testflight, desktop-msi-signed).
#
#   • app.yaml#targets      → which PLATFORMS a fork ships   (this file, owner: fork)
#   • DEPLOYMENT_MANIFEST    → which TARGETS exist per platform (owner: merge — new template
#                              targets propagate on sync; the fork keeps its enabled/tier)
#
# A concrete deploy TARGET is active iff BOTH hold:
#   (1) its platform is enabled here in app.yaml#targets, AND
#   (2) the target's own `enabled:` is true in DEPLOYMENT_MANIFEST.yaml.
# The two coexist at different granularity — neither replaces the other.
# NOTE: macOS deploy targets live UNDER the manifest's `desktop` platform (mac-app-store,
# mac-testflight, dmg-notarized) — there is no separate `macos` platform block in the manifest.
targets:
  android: { enabled: true, tier: internal }
