# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g

# Kotlin compile daemon heap. SEPARATE process from the Gradle daemon above — `org.gradle.jvmargs`
# does NOT size it, and neither does a `-Dkotlin.daemon.jvmargs=…` command-line flag.
# Without this line the value falls through to whatever each developer happens to have in
# ~/.gradle/gradle.properties, so the SAME commit compiles on one machine and OOMs on another —
# the template must ship a working default rather than inherit an unknown one.
# Observed 2026-09-04 on a fork: a 2 GB inherited default died with "Daemon compilation failed:
# java.lang.OutOfMemoryError: Java heap space" across ~15 feature modules compiling in parallel.
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Not encouraged by Gradle and can produce weird results. Wait for isolated projects instead.
org.gradle.configureondemand=false

# Enable caching between builds.
org.gradle.caching=true

# Enable configuration caching between builds.
org.gradle.configuration-cache=true
# This option is set because of https://github.com/google/play-services-plugins/issues/246
# to generate the Configuration Cache regardless of incompatible tasks.
# See https://github.com/android/nowinandroid/issues/1022 before using it.
org.gradle.configuration-cache.problems=warn

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Disable build features that are enabled by default,
# https://developer.android.com/build/releases/gradle-plugin#default-changes
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.testOptions.unitTests.isIncludeAndroidResources = true
org.jetbrains.compose.experimental.jscanvas.enabled=true

kotlin.native.ignoreDisabledTargets=true
# Increase memory for Kotlin/Native compiler (separate JVM from Gradle daemon)
kotlin.native.jvmArgs=-Xmx12g -XX:+UseG1GC
# Disable memory-intensive compiler optimizations
kotlin.native.disableCompilerDaemon=true
kotlin.kmp.unresolvedDependenciesDiagnostic=false
kotlin.apple.xcodeCompatibility.nowarn=true

# NOTE: SDK levels (compileSdk / minSdk / targetSdk) are single-sourced from
# gradle/libs.versions.toml — the convention plugins read them via
# `libs.findVersion("compileSdk"|"minSdk"|"targetSdk")`. They were previously ALSO
# declared here (21/36/36) but nothing read those values (the toml holds 26/37/37),
# so the stale duplicates were removed (B3 dedup, epic pure-white-label-store5-network).

# v2.0 matrix mode opt-in — builds every variant in one Gradle invocation.
# Comment-out (or set to false) to keep v1.x active-variant-only semantics.
#
# Disabled (2026-05-19) to unblock the kover coverage gate.
# Matrix mode registers inactive-variant compilations whose defaultSourceSet
# chain does NOT include the target's standard `<target>Main` source set, so
# `expect val ... : Module` declarations in commonMain fail to resolve their
# actuals (which live in desktopMain / iosMain / etc) when KMP compiles the
# inactive variant. Reproducible on `:core:database`, `:core:data`, and any
# of the ~30 expect declarations across `core/*`, `core-base/*`, `feature/*`.
#
# Flip back to `true` once kmp-product-flavors upstream-fixes the source-set
# wiring (variant.defaultSourceSet.dependsOn(targetMain) for inactive-variant
# compilations). Tracking: kmp-project-template Gap #1 in
# docs/reports/source-coverage-260519.md → resolution pending the upstream PR.
kmpFlavors.buildMatrix=false

# Desktop packaging: bypass Homebrew JDK vendor check (known CMP issue: JB#3107).
# Homebrew distributes a vendored JDK that triggers a false-positive warning in the
# compose.desktop packaging plugin. This flag suppresses the check without affecting
# the produced DMG/app bundle in any way.
compose.desktop.packaging.checkJdkVendor=false

# ===== Fork identity =====
# The fork's app identity (id, display name, version, org, endpoints, …) is single-sourced from the
# fork-owned `app-profile/` (app.yaml + platforms/**); `syncForkConfig` generates the derived
# build-bridge `gradle/fork.properties` from it, which the SyncForkConfig
# + KMPFlavors convention plugins read → gradle/libs.versions.toml (appId/appDisplayName), Config.xcconfig,
# and per-module BuildKonfig (e.g. feature/settings APP_DISPLAY_NAME). The former APP_ID_BASE / APP_NAME /
# APP_VERSION_BASE / APP_BUNDLE_DISPLAY_NAME / APP_BRAND_PREFIX values here were "reference only" and never
# read (dead duplicates — and APP_NAME even disagreed with fork.properties#app.display.name); removed in
# the B3 dedup (epic pure-white-label-store5-network). See docs/architecture/CUSTOMIZATION_SURFACE.md.
#
# fork.project.name IS live: settings.gradle.kts reads it for rootProject.name, and SyncForkConfig
# regenerates it here from fork.properties#project.name.
fork.project.name=kmp-project-template

# KSP2 standalone mode — required for KSP + compiler plugins on Kotlin 2.4.0
ksp.useKSP2=true
